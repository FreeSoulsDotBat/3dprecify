name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node (pricing-core + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check pricing-core
        run: npm run typecheck --workspace @3dprecify/pricing-core
      - name: Test (all workspaces)
        run: npm test
  # backend (pytest/ruff/mypy) and e2e (Playwright) jobs are added when backend/ and apps/web/ land.
