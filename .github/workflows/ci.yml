name: CI

on:
  push:
    branches: [develop, main, release]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # D4 (R2-G3) / 006 FR-212: ONE job invoking the LITERAL `pnpm gate:all` — the same command lefthook
  # pre-push runs. Parity is by identical invocation, inspectable here and in lefthook.yml (SC-206),
  # never asserted by a meta-test. Replaces the former separate Frontend/Backend gate jobs.
  gate:
    name: Gate (pnpm gate:all — same command as pre-push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm gate:all

  # The Vite production build check the former Frontend job carried (analyze I1): kept as its own
  # explicit job — it is not in the FR-212 gate list (would slow every push) but must not silently
  # vanish from CI behind the e2e webServer's incidental build.
  build:
    name: Web build (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @3dprecify/web build

  contract-drift:
    name: Contract drift-guard (OpenAPI + Orval) — SC-6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: backend
      - name: Regenerate OpenAPI + client
        run: |
          cd backend && PYTHONPATH=. uv run python scripts/export_openapi.py && cd ..
          pnpm --filter @3dprecify/web gen:api
      - name: Fail on drift
        run: git diff --exit-code -- contracts/openapi.json apps/web/src/shared/api

  e2e:
    name: E2E (Playwright + Firebase Auth emulator + backend/Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      # The Firebase Auth emulator (started by `pnpm e2e`) runs on the JVM.
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      # E2 T025 — the catalog e2e drives the REAL backend: the Playwright global-setup brings up
      # the compose Postgres + applies migration 0001, the backend webServer runs `uv run …`, and
      # the premium-loop spec grants via the operator CLI (`uv run python -m app.scripts.…`).
      # uv + the backend venv are therefore required (Docker Compose ships on the ubuntu runner).
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm --filter @3dprecify/web exec playwright install --with-deps chromium
      # Shell + authenticated calculator + full-stack catalog premium loop, all under the emulator.
      - run: pnpm e2e

  docker:
    name: Backend image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t precifica3d-backend:ci ./backend

  # A migration already merged into develop is immutable — amending it in place silently diverges
  # every environment that already ran the old version (it caused the PR-B local-DB CHECK drift).
  # Full history (fetch-depth 0) so the merge-base with origin/develop is reachable.
  migration-guard:
    name: Migration-amend guard (merged migrations are immutable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # T052 (013 audit remediation, finding P-03): the single-head check added to this script
      # needs `uv run alembic heads` (metadata-only, no DB) — the backend venv, not frontend.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: backend
      - run: sh scripts/check-migrations.sh

  # 015/A4 ([F09-001], SEC-014-02) — uma tag e um ponteiro MUTAVEL. Quem controla o repositorio da
  # action pode repontar `@v2` para codigo arbitrario, que passa a rodar dentro do job — no caso do
  # `deploy.yml`, com `id-token: write` e as credenciais WIF de producao. O parecer classificou isso
  # como ALTA e escreveu "imediatamente"; ficou tres meses sem ser feito, porque dependia de alguem
  # lembrar. Este job existe para que nao dependa mais.
  action-pins:
    name: "Action pinning guard: every uses: is a 40-char SHA"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sh scripts/check-action-pins.sh

  secret-scan:
    name: Secret scan (gitleaks + trufflehog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists PR commits via the API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified # fail only on verified secrets (avoid false positives)

  # Single roll-up status for the convention-only merge gate (ADR-0001). Make THIS the required check.
  ci-pass:
    name: CI pass
    runs-on: ubuntu-latest
    needs: [gate, build, contract-drift, e2e, docker, migration-guard, action-pins, secret-scan]
    if: always()
    steps:
      - name: Verify all gates passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more gates failed."; exit 1
          fi
          echo "All gates green."
