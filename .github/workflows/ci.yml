name: CI

on:
  push:
    branches: [develop, main, release]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # D4 (R2-G3) / 006 FR-212: ONE job invoking the LITERAL `pnpm gate:all` — the same command lefthook
  # pre-push runs. Parity is by identical invocation, inspectable here and in lefthook.yml (SC-206),
  # never asserted by a meta-test. Replaces the former separate Frontend/Backend gate jobs.
  gate:
    name: Gate (pnpm gate:all — same command as pre-push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm gate:all

  # The Vite production build check the former Frontend job carried (analyze I1): kept as its own
  # explicit job — it is not in the FR-212 gate list (would slow every push) but must not silently
  # vanish from CI behind the e2e webServer's incidental build.
  build:
    name: Web build (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @3dprecify/web build

  contract-drift:
    name: Contract drift-guard (OpenAPI + Orval) — SC-6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: backend
      - name: Regenerate OpenAPI + client
        run: |
          cd backend && PYTHONPATH=. uv run python scripts/export_openapi.py && cd ..
          pnpm --filter @3dprecify/web gen:api
      - name: Fail on drift
        run: git diff --exit-code -- contracts/openapi.json apps/web/src/shared/api

  e2e:
    name: E2E (Playwright + Firebase Auth emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The Firebase Auth emulator (started by `pnpm e2e`) runs on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @3dprecify/web exec playwright install --with-deps chromium
      # Shell gate + authenticated calculator e2e, both under the Auth emulator.
      - run: pnpm e2e

  docker:
    name: Backend image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t precifica3d-backend:ci ./backend

  secret-scan:
    name: Secret scan (gitleaks + trufflehog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists PR commits via the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified # fail only on verified secrets (avoid false positives)

  # Single roll-up status for the convention-only merge gate (ADR-0001). Make THIS the required check.
  ci-pass:
    name: CI pass
    runs-on: ubuntu-latest
    needs: [gate, build, contract-drift, e2e, docker, secret-scan]
    if: always()
    steps:
      - name: Verify all gates passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more gates failed."; exit 1
          fi
          echo "All gates green."
