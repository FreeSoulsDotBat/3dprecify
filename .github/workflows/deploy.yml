name: Deploy

# ADR-0005. Keyless deploy via Workload Identity Federation (no JSON keys).
# main -> UAT (auto); tag v* -> prod (manual promotion). Each job is INERT until its repo var is set true
# and the matching GitHub Environment (uat / production) holds the secrets/vars below.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for WIF

jobs:
  uat:
    name: Deploy to UAT
    if: ${{ github.ref == 'refs/heads/main' && vars.UAT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: uat
    concurrency: deploy-uat
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy backend (Cloud Run)
        run: |
          gcloud run deploy precifica3d-backend \
            --source ./backend \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT }}" \
            --allow-unauthenticated \
            --set-env-vars "P3D_APP_ENV=dev,P3D_REGION=${{ vars.GCP_REGION }}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @3dprecify/web build
      - name: Deploy SPA (Firebase Hosting)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT }}
          channelId: live

  prod:
    name: Deploy to production
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-prod
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy backend (Cloud Run)
        run: |
          gcloud run deploy precifica3d-backend \
            --source ./backend \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT }}" \
            --allow-unauthenticated \
            --set-env-vars "P3D_APP_ENV=prod,P3D_REGION=${{ vars.GCP_REGION }}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @3dprecify/web build
      - name: Deploy SPA (Firebase Hosting)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT }}
          channelId: live
