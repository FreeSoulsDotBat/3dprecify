name: Deploy

# Keyless deploy via Workload Identity Federation (no JSON keys). INERT until Jonatan provisions GCP/WIF
# and sets repo var DEPLOY_ENABLED=true plus the secrets/vars referenced below.
on:
  push:
    branches: [main]

concurrency: deploy-prod

permissions:
  contents: read
  id-token: write # required for WIF

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run (southamerica-east1)
        run: |
          gcloud run deploy precifica3d-backend \
            --source ./backend \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT }}" \
            --allow-unauthenticated \
            --set-env-vars "P3D_APP_ENV=prod,P3D_REGION=${{ vars.GCP_REGION }}"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @3dprecify/web build

      - name: Deploy SPA to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT }}
          channelId: live
