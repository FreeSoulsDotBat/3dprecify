<!doctype html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#7800ff" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="apple-touch-icon" href="icons/icon-192.png" />
        <title>Precifica3D</title>
        <!-- Pre-paint theme resolution (A34): saved pref → OS prefers-color-scheme →
         dark, applied to <html data-theme> BEFORE React mounts so first paint
         never flashes the wrong theme. Key mirrors THEME_STORAGE_KEY in
         shared/ui/theme-store.ts (zustand persist shape: {"state":{"theme":…}}). -->
        <script>
            (function () {
                try {
                    var raw = localStorage.getItem("precifica3d-theme");
                    var saved = raw && JSON.parse(raw).state && JSON.parse(raw).state.theme;
                    var theme =
                        saved === "light" || saved === "dark"
                            ? saved
                            : window.matchMedia &&
                                window.matchMedia("(prefers-color-scheme: light)").matches
                              ? "light"
                              : "dark";
                    document.documentElement.dataset.theme = theme;
                } catch (e) {
                    document.documentElement.dataset.theme = "dark";
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
