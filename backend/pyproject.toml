[project]
name = "precifica3d-backend"
version = "0.0.0"
description = "Precifica3D backend (FastAPI). Verifies Firebase tokens; never recomputes the pricing formula."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "firebase-admin",
    "pydantic-settings",
    "structlog",
    "asgi-correlation-id",
    "sentry-sdk[fastapi]",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "uuid6>=2025.0.1",
    "reportlab==5.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "schemathesis",
    "ruff",
    "basedpyright",
    "import-linter",
    "testcontainers>=4.14.2",
]

[tool.uv]
package = false

# --- Lint & format (Ruff) ---
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
# S101 (assert) is fine in tests; relaxed per-file below.

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# Autogenerated Alembic migrations carry long constraint strings verbatim; line-length lint on
# machine-generated files adds churn, not quality. Everything else in alembic/ stays fully linted.
"alembic/versions/*" = ["E501"]

# --- Type checking (basedpyright, strict) ---
[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["app", "tests"]
extraPaths = ["."]  # resolve the `app` package from the backend root (matches pytest pythonpath)
# FastAPI registers route handlers via decorators; pyright can't see that use → false positives.
reportUnusedFunction = false
# Third-party libs (firebase-admin) ship no type stubs; don't fail strict on that.
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
# Starlette TestClient / httpx are partially untyped; relax "unknown type" noise in tests only (app/ stays strict).
root = "tests"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

# --- Tests ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# --- Architecture contracts (import-linter) ---
# Domain/layer contracts grow as real modules land (E1+). For the skeleton we enforce the one invariant
# that matters now: settings is a dependency-free config leaf (imports nothing from app.*).
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Settings is a dependency-free leaf"
type = "forbidden"
source_modules = ["app.settings"]
forbidden_modules = ["app.main", "app.auth", "app.errors", "app.observability", "app.db", "app.entitlement", "app.models"]

# E2 layering (ADR-0012/0013): API routes depend on the entitlement seam, which depends on the DB
# layer — never the other way around. `layers` enforces the downward-only import direction.
[[tool.importlinter.contracts]]
name = "E2 layering: api -> entitlement -> db"
type = "layers"
layers = [
    "app.api",
    "app.entitlement",
    "app.db",
]

# E4 (009/PR-C, review finding): `app.services` is a real new top layer — the export renderer lives
# there. This file's own convention says "contracts grow as real modules land", and Principle VIII
# says architecture is never inferred, so the boundary is declared instead of left in a comment.
# The direction that matters: a service must never reach back UP into a route. Without this, the
# tempting `from app.api.history import owned_snapshot` inside a service would pass CI in silence
# and close an api <-> services cycle. `quote_render` imports only `app.models` + reportlab, so it
# holds today.
[[tool.importlinter.contracts]]
name = "E4 layering: api -> services -> models"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.models",
]
