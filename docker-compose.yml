# Local development infrastructure (E2 / ADR-0013). ONLY the database lives here — the app itself
# runs via `uv run uvicorn` / `pnpm dev` as before. Dev credentials are compose-local defaults
# (overridable via env), never production secrets; Cloud SQL provisioning is the v1-launch increment
# (same Alembic migrations replayed — nothing here to migrate away from).
services:
  postgres:
    image: postgres:17-alpine
    container_name: precifica3d-postgres
    environment:
      POSTGRES_USER: ${P3D_DB_USER:-precifica3d}
      POSTGRES_PASSWORD: ${P3D_DB_PASSWORD:-precifica3d-dev}
      POSTGRES_DB: ${P3D_DB_NAME:-precifica3d}
    ports:
      - "${P3D_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${P3D_DB_USER:-precifica3d}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
