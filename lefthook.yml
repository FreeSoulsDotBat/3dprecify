# Local git hooks (ADR-0004 + D4/R2-G3). Fast checks on commit (format + lint on staged files);
# pre-push runs the LITERAL same `pnpm gate:all` the CI gate job runs — frontend gates
# (format/lint/boundaries/types/coverage) AND backend gates (ruff/basedpyright/pytest/import-linter).
# Parity is by identical invocation, inspectable here and in .github/workflows/ci.yml (SC-206).
# Accepted cost: slower push (decided R2-G3). e2e/docker/drift/secret-scan are CI-only by nature.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,md,yml,yaml,css}"
      run: pnpm prettier --check {staged_files}
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: pnpm eslint {staged_files}

pre-push:
  parallel: false
  commands:
    gate:
      run: pnpm gate:all
    # A merged migration is immutable — catch an in-place amend before it leaves the machine
    # (mirrors the CI migration-guard job; needs origin/develop, fetched best-effort by the script).
    migration-guard:
      run: sh scripts/check-migrations.sh

# post-merge (ADR-0014): after a merge into `develop`, incrementally refresh the graphify
# knowledge graph — code is AST-extracted (no LLM, 0 tokens, ~20s). Best-effort/non-fatal: a
# fast-forward pull may not fire post-merge, so the primary enforcement is the AI close-out
# procedure + `pnpm graph:update` (see CLAUDE.md). The script guards to develop and no-ops if
# graphify is not installed.
post-merge:
  commands:
    graph-refresh:
      run: sh scripts/graph-refresh.sh
