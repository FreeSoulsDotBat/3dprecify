# Local git hooks (ADR-0004 + D4/R2-G3). Fast checks on commit (format + lint on staged files);
# pre-push runs the LITERAL same `pnpm gate:all` the CI gate job runs — frontend gates
# (format/lint/boundaries/types/coverage) AND backend gates (ruff/basedpyright/pytest/import-linter).
# Parity is by identical invocation, inspectable here and in .github/workflows/ci.yml (SC-206).
# Accepted cost: slower push (decided R2-G3). e2e/docker/drift/secret-scan are CI-only by nature.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,md,yml,yaml,css}"
      run: pnpm prettier --check {staged_files}
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: pnpm eslint {staged_files}

pre-push:
  parallel: false
  commands:
    gate:
      run: pnpm gate:all
    # A merged migration is immutable — catch an in-place amend before it leaves the machine
    # (mirrors the CI migration-guard job; needs origin/develop, fetched best-effort by the script).
    migration-guard:
      run: sh scripts/check-migrations.sh

# INVARIANT (ADR-0022 §Amendment to ADR-0014): graph freshness on LOCAL paths is owned by
# `graphify hook install`'s own `post-commit` + `post-checkout` hooks, written directly to .git/hooks/
# OUTSIDE lefthook's management. NEVER declare `post-commit` or `post-checkout` sections in this file —
# `lefthook install` would overwrite graphify's hooks and silently kill the primary refresh mechanism.
# (`post-merge` below is NOT one of graphify's hooks — declaring it here is safe, proven dod-evidence §3.)

# post-merge (re-added 2026-07-19, owner decision — ADR-0022 §Amendment addendum): the deterministic
# net for the REMOTE squash-merge path. MEASURED FACT 2026-07-19: a fast-forward `git pull` DOES fire
# post-merge on this machine (git 2.45.1, pull.rebase=false — scratch-repo proof, dod-evidence §3);
# the "may not fire" premise the first retirement note repeated was a never-tested hedge. The script
# guards to `develop` and no-ops without graphify. Boundary: `git pull --rebase` fires no post-merge.
post-merge:
  commands:
    graph-refresh:
      run: sh scripts/graph-refresh.sh
